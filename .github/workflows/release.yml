name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ${package_version}." >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit is not reachable from origin/main." >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="biome-anti-slop-${version}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${archive}" \
            README.md \
            LICENSE \
            THIRD_PARTY_NOTICES.md \
            rules \
            skills/biome-anti-slop
          cd dist
          sha256sum "$archive" > "${archive}.sha256"
      - name: Create immutable-ready release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --fail-on-no-commits \
              --generate-notes \
              --title "biome-anti-slop $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
